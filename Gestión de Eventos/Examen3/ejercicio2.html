<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 2 - Robot</title>
<style>
    body { margin: 40px; }

    #zona-exploracion {
        width: 600px;
        height: 400px;
        background-color: #f4f4f4;
        border: 3px solid black;
        position: relative;
        overflow: hidden;
    }

    #robot {
        width: 50px;
        height: 50px;
        background-color: steelblue;
        position: absolute;
        top: 0;
        left: 0;
    }

    .obstaculo {
        width: 60px;
        height: 60px;
        background-color: crimson;
        position: absolute;
    }

    #mensaje {
        margin-top: 15px;
        font-weight: bold;
        color: red;
        height: 20px;
    }
</style>
</head>
<body>

<h2>Simulador de Robot Explorador</h2>

<div id="zona-exploracion">
    <div id="robot"></div>

    <div class="obstaculo" style="top:100px; left:200px;"></div>
    <div class="obstaculo" style="top:250px; left:400px;"></div>
</div>

<div id="mensaje"></div>

<script src="script2NombreApellidos.js"></script>
</body>
</html>

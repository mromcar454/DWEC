<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 3 - Mochila</title>
<style>
    body { font-family: Arial; padding: 20px; }

    .inventario, .equipo {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
    }

    .item {
        width: 80px;
        height: 80px;
        background-color: lightblue;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: grab;
        border: 2px solid black;
    }

    .casilla {
        width: 100px;
        height: 100px;
        border: 3px dashed gray;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #papelera {
        width: 120px;
        height: 120px;
        background-color: darkred;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
    }

    .arrastrando {
        opacity: 0.5;
    }
</style>
</head>
<body>

<h2>Sistema de Mochila Estratégica</h2>

<h3>Inventario</h3>
<div class="inventario">
    <div class="item" draggable="true" data-categoria="arma">Espada</div>
    <div class="item" draggable="true" data-categoria="casco">Casco</div>
    <div class="item" draggable="true" data-categoria="escudo">Escudo</div>
</div>

<h3>Equipo</h3>
<div class="equipo">
    <div class="casilla" data-tipo="arma">Arma</div>
    <div class="casilla" data-tipo="casco">Cabeza</div>
    <div class="casilla" data-tipo="escudo">Mano</div>
</div>

<h3>Zona de Eliminación</h3>
<div id="papelera">PAPELERA</div>

<script src="script3NombreApellidos.js"></script>
</body>
</html>
